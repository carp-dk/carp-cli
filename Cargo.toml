[workspace]
members = ["packages/carp-protocol", "packages/carp-catalog"]

# Settings every crate in the workspace inherits, so the version and the
# licence are stated once.
[workspace.package]
version = "0.2.0"
authors = ["Alireza Hajebrahimi <6937697+iarata@users.noreply.github.com>"]
license = "MIT"
edition = "2024"
repository = "https://github.com/carp-dk/carp-cli"

# Dependencies shared by the binary and the packages. Pinning them here keeps
# a single version of serde/chrono in the tree, which matters because the
# protocol types cross crate boundaries.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[package]
name = "carp-cli-rust"
version.workspace = true
description = "CARP Cli in Rust"
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true

# The crate is named after the repository, the command is not: what users type,
# and what the README documents throughout, is `carp`.
[[bin]]
name = "carp"
path = "src/main.rs"

[dependencies]
# Workspace packages: the protocol domain model and the upstream catalogue.
carp-protocol = { path = "packages/carp-protocol" }
carp-catalog = { path = "packages/carp-catalog" }

# Terminal UI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# Async runtime + HTTP
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
futures-util = "0.3"

# Text measurement: emoji occupy two cells, so padding cannot count chars
unicode-width = "0.2"

# Serialization
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Auth (OAuth2 authorization code + PKCE against Keycloak)
oauth2 = "5"
subtle = "2"
tiny_http = "0.12"
url = "2"
webbrowser = "1"
base64 = "0.22"

# Local cache
turso = "0.7.2"

# Errors + paths
color-eyre = "0.6.5"
dirs = "6"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1   # Allows compiler to perform better optimization.
lto = true          # Enables Link-time Optimization.
opt-level = "s"     # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true        # Ensures debug symbols are removed.

# Tests parse and re-serialise the whole reference corpus; the default
# unoptimised build makes that noticeably slow.
[profile.test]
opt-level = 1
